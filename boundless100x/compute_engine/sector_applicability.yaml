# Sector-by-metric applicability — which metrics measure nothing useful for
# which kind of company.
#
# Read by `compute_engine/sector.py`. R6's first expansion trigger fires off
# this table, and R7 puts the reason string below in front of the reader
# verbatim — so every reason here is written for an owner reading a report,
# not for whoever maintains the metric. "does not apply" on its own tells a
# reader nothing; the sentence explaining why is the deliverable.
#
# THREE-VALUED, and the absent case is the common one. A sector key present
# here has been **reviewed**: everything not listed under its `not_applicable`
# applies to it. A sector with no key at all is **indeterminate** — nobody has
# looked — and must never read as "applies" (KTD6, R4). That asymmetry is the
# whole point of the file. A silent "applies" is how Power Finance Corporation
# came to be scored as a failing manufacturer: three of the five visible rows
# in its Quality — Business section measured the wrong thing, at 0% each, and
# nothing on the page said so.
#
# Keys match the way `sector.py` already matches study sectors: whole-phrase,
# word-boundary, plural-tolerant. So `Finance` covers Screener's own "Finance"
# breadcrumb and would cover a future "Housing Finance" with no new entry —
# that inheritance is why the table keys on the sector bucket rather than on
# the company.

sectors:

  Finance:
    label: "Lenders and financing NBFCs"
    # PFC, JIOFIN and EDELWEISS in the cached corpus. Every exclusion below
    # traces to one of two facts about a lending balance sheet: the assets ARE
    # the business rather than equipment supporting it, and money lent out is
    # booked as an operating cash outflow, so the whole CFO+CFI free-cash-flow
    # chain inverts. Measured 2026-08-08 — PFC: turnover 0.09x, equity
    # multiplier 9.37x, FCF yield -5.7%, 2 of 10 FCF-positive years, DCF margin
    # pinned at the -100% floor. EDELWEISS: 0.24x, 9.46x, -0.6%, and a DCF
    # margin of +147% flagged `dcf_undervalued`. That last one matters: the
    # readings are excluded because they are meaningless, not because they are
    # unflattering, and the same broken series swings both ways.
    not_applicable:
      dupont_turnover: >-
        A lender's assets are the loan book it earns on, not plant it has to
        sweat. Revenue is the interest spread on those assets, so this ratio
        measures how thin the spread is rather than how hard the business
        works what it owns — and it reads near zero for a perfectly healthy
        lender.
      dupont_equity_multiplier: >-
        Borrowing many times equity is a lender's product, not a risk it took
        on by accident. The balance sheet is funded deliberately and its size
        is set by capital-adequacy rules, so a high multiple here is the
        business model working rather than a warning about it.
      fcf_yield: >-
        Money lent out is counted as an operating outflow, so a lender that
        grows its loan book reports deeply negative free cash flow for
        succeeding. The figure tracks how fast the book is growing, not what
        cash is left over for owners.
      fcf_consistency: >-
        Counts the years that same lending-distorted cash flow came out
        positive — which, for a lender, counts the years the loan book shrank.
        A low score here is a record of growth.
      dcf_margin_of_safety: >-
        Values the company by discounting that same free cash flow, so a
        lender growing its book averages negative and the calculation returns
        its -100% floor before reaching any judgement about the business. When
        the lending flows happen to net out positive it swings just as far the
        other way, for reasons equally unrelated to what the company is worth.
      reverse_dcf_growth: >-
        Solves for the growth rate that would justify today's price using the
        same free-cash-flow chain, so it inherits the same inversion. On a
        lender it reports what the market must believe about a cash-flow line
        that measures loan-book movement, which is not a belief anyone holds.
      ev_ebitda: >-
        Enterprise value adds debt to the price on the reasoning that a buyer
        must repay it, and EBITDA is struck before interest on the reasoning
        that interest is a financing choice. For a lender both halves are
        wrong at once: the borrowings are the raw material rather than an
        obligation to clear, and interest is the main cost of goods. The
        ratio pairs an inflated numerator with a denominator that has not
        paid for anything yet.
      cash_conversion: >-
        Compares operating cash flow with operating profit, and for a lender
        that cash flow is dominated by money going out on new loans and coming
        back on repayments. The ratio tracks the direction the loan book moved
        in, not whether the profits were real.
      capital_reinvestment_rate: >-
        Measures new capital put to work as a share of operating profit. For a
        lender the capital deployed is the loan book itself, which this does
        not look at, so a company funding record lending reads as returning
        capital to owners.
      reinvestment_rate: >-
        Capital expenditure against depreciation. A lender owns branches and
        computers, not plant, so the depreciation base is tiny and the ratio
        swings wildly on ordinary office spending — it says nothing about
        whether the business is being reinvested in.
      working_capital_days_trend: >-
        Working capital is the gap between money tied up in stock and
        customers and money owed to suppliers. A lender has none of those in
        the ordinary sense, and its receivables ARE its product, so the figure
        is a by-product of balance-sheet size rather than a discipline anyone
        manages.
      # ── The two that KEEP their flags ─────────────────────────────────
      # Everything above is excluded because the reading itself is broken, so
      # its flags are withdrawn with its score (the default). These two are
      # different in kind: the reading is sound and only the THRESHOLD was
      # calibrated for a manufacturer. Four times leverage is four times
      # leverage whatever we score it out of ten, and a lender's owner still
      # needs to be told. Suppressing these would remove the only leverage
      # warning a lender gets.
      debt_equity:
        keep_flags: true
        reason: >-
          Borrowing many times equity is what a lender sells, and the level is
          set by capital-adequacy rules rather than by appetite for risk. The
          thresholds here are calibrated for a manufacturer, where 4x would be
          distress; for an NBFC it is unremarkable and for a bank it would be
          conservative. The figure and its high-debt warning are still shown
          and still reach the model — what is withdrawn is a mark out of ten
          awarded against the wrong yardstick.
      interest_coverage:
        keep_flags: true
        reason: >-
          Operating profit over interest paid. For a lender interest IS the
          principal cost of doing business, not a charge left over after it, so
          this ratio sits close to 1x by construction on a perfectly solvent
          book — the same reading that means imminent default for a
          manufacturer. Solvency for a lender is a capital-adequacy and
          asset-quality question, which needs data this pipeline does not
          fetch; the honest position is that the risk is unmeasured here rather
          than measured by this.

  Investment Company:
    label: "Holding vehicles whose assets are mostly other companies' equity"
    # Matched on Screener's `sector_industry` breadcrumb rather than its
    # `sector`, which reads "Finance" for JIOFIN — see `applicability_labels`.
    # Both labels are looked up and their exclusions merge, so a company here
    # inherits the lender rules above as well as these.
    #
    # **The distinguishing fact is that the return does not pass through the
    # income statement.** JIOFIN carries ₹133,089 Cr of investments against
    # ₹163,467 Cr of total assets — 81% — and 65% of its appraised value is a
    # 6.1% stake in Reliance (Motilal Oswal SOTP, Apr 2026). A listed stake
    # appreciates in the share price, not in PAT, so the P&L that survives is a
    # dividend cheque against a very large equity base.
    #
    # Note what is NOT excluded, because it is the closer call: `roe_5yr_avg`,
    # `roce_5yr_avg`, `roiic` and the two >15% counts all stay scored. A 0.91%
    # RoE on ₹134,000 Cr of equity is a true and material statement — the
    # equity is not being worked — and it is the central bear point on the
    # company. Withdrawing it would have removed the finding rather than the
    # distortion. What IS withdrawn below is the handful of ratios whose
    # *denominator* is a treasury balance rather than a business.
    not_applicable:
      operating_margin_5yr: >-
        Revenue for a holding vehicle is dividend and interest received on
        investments, and the costs beneath it are a head office rather than a
        cost of production. A margin computed on that says how few staff the
        holding company employs, not how profitable anything it owns is —
        JIOFIN reads 78.5% and owns no business earning near that.
      dupont_margin: >-
        Profit as a share of that same investment income, so it inherits the
        same problem: it measures the head office's overhead against its
        dividend cheque and tells a reader nothing about the businesses whose
        earnings the holding actually represents.

  Industrial Products:
    label: "Manufacturers of physical goods"
    # Reviewed, and nothing is excluded. This is the shape every metric above
    # was written for: revenue produced by a productive asset base, investing
    # cash flow that is capital expenditure, borrowings that fund plant rather
    # than being the product. ASTRAL reads turnover 1.13x, equity multiplier
    # 1.43x, FCF yield +1.6%, nine of ten years FCF-positive, and a DCF margin
    # of -74% that is a genuine "priced richly" reading rather than a
    # structural floor — five metrics all measuring what they claim to.
    #
    # The entry exists so a manufacturer resolves to `applies` rather than
    # `indeterminate`. It is the baseline the lender case is a departure from,
    # and without it stated the departure has nothing to be a departure from.
    not_applicable: {}

# ── Considered and deliberately NOT declared ──────────────────────────────
#
# A wrong `does_not_apply` suppresses a real quality signal and leaves no
# trace, which is a worse failure than an indeterminate nobody acts on. So the
# bar for adding an entry is evidence from the metric's implementation, not
# intuition about the industry.
#
#   Finance / roce_5yr_avg, roce_consistency, cap_proxy — the closest call in
#   this file, and the answer is no. RoCE divides by equity PLUS borrowings,
#   so for a lender the denominator is the funded book and the reading sits
#   structurally in the low teens however good the business is: EDELWEISS
#   scores nought years above 15% and that is nearer a description of the
#   sector than a finding about the company. But miscalibrated is not the same
#   as meaningless, and the distinction is the whole bar here. Unlike the FCF
#   chain, RoCE does not INVERT for a lender — it still orders one lender
#   against another the right way round, and Screener computes and publishes
#   it for NBFCs rather than suppressing it. Excluding all three would also
#   have left Longevity resting on 35% of its declared weight, which
#   `low_data_coverage` would then have converted straight back into a capped
#   action. The answer to a miscalibrated bar is a second bar that fits:
#   `roe_consistency` was added beside `roce_consistency` for exactly this,
#   asking the same durability question on the return a balance-sheet business
#   is actually judged by.
#
#   Finance / the reverse-DCF VETO on the price eligibility gate — distinct
#   from the metric, which IS excluded above. `registry.yaml` names
#   `reverse_dcf_growth` as a `veto_source`, and gates read the metric results
#   directly rather than the scores, so the exclusion does not reach them: a
#   lender can still be vetoed on `reverse_dcf_overpriced`, computed off the
#   same chain this file calls meaningless. Left alone deliberately — the
#   veto's failure direction is to refuse a company, and a gate that is too
#   strict for the wrong reason is a smaller harm than one silently loosened.
#   Worth revisiting when a lender is actually vetoed by it.
#
#   Capital Markets (BSE, CAMS, CDSL, KFINTECH) — exchanges, depositories and
#   registrars carry large investment and client-float balances that depress
#   asset turnover, but their cash flows are genuinely free cash flow and
#   nothing in their statements inverts the way a lender's does. Unreviewed is
#   the honest answer, and unreviewed reads indeterminate.
#
# Two entries moved OUT of this section when the table started reaching the
# scorer. `cash_conversion` was kept on the reasoning that excluding it would
# remove a *favourable* misreading (EDELWEISS reads 87% and earns a `cash_cow`
# flag) — but the file's own rule two paragraphs up is that readings are
# excluded because they are meaningless, not because they are unflattering,
# and a false `cash_cow` on a lender whose book value per share compounded at
# -9.9% is the more dangerous direction of the two. `working_capital_days_trend`
# was kept pending an argument; the argument is now written beside the entry.
