# Cross-element derived metrics (from Dec 2025 Quality-Growth Matrix)
element: composite

# On the `presentation:` block, see the note at the head of size.yaml.

metrics:
  quality_growth_quadrant:
    name: "Quality-Growth Matrix Position"
    module: "builtin.composite"
    function: "compute_qg_quadrant"
    # `metadata` carries the industry breadcrumb this reads to tell a single
    # operating business from a holding company whose ratios are a blend.
    inputs: ["financials", "ratios", "metadata"]
    params:
      quality_threshold: 15
      growth_threshold: 15
    scoring:
      mode: "categorical"
      categories:
        "true_wealth_creator": 10
        "quality_trap": 4
        "growth_trap": 4
        "wealth_destroyer": 1
      weight: 0.0
    display: { format: "{}", section: "executive_summary", peer_compare: true }
    presentation:
      unit: "category"
      direction: "not_directional"
      meaning: >-
        Which corner of the quality-and-growth grid the company sits in.
        High on both is the only corner the Dec 2025 study found wealth
        creators in.
      bands: []
      # Written for a reader, not a maintainer: R15 forbids a raw parameter
      # or function name reaching the page, and this string renders verbatim.
      # The thresholds it describes are the two params declared just above.
      bands_absent_reason: >-
        The value is already a named grade, so a numeric band walk has
        nothing to add. A company's corner is set by two configured lines —
        one on return on capital employed, one on profit growth — applied to
        those two figures rather than to the grade shown here.
