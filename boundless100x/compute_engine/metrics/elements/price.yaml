# Reference: QGLP Checklist Q20-Q24; "Trailing PEG" methodology (Dec 2025)
element: price

metrics:
  pe_ttm:
    name: "P/E (TTM)"
    module: "builtin.valuation"
    function: "compute_pe_ttm"
    inputs: ["financials", "metadata"]
    scoring: { mode: "sector_relative_percentile", direction: "lower_is_better", weight: 0.12 }
    display: { format: "{:.1f}x", section: "valuation_analysis", peer_compare: true }

  peg_ratio:
    # Trailing PEG on a 5yr EPS CAGR window — no forward estimate feeds this.
    # See compute_peg's docstring; distinct from trailing_peg only by window
    # (5yr EPS here vs. 3yr PAT there), not by being forward-looking.
    name: "PEG Ratio (5yr EPS, trailing)"
    module: "builtin.valuation"
    function: "compute_peg"
    inputs: ["financials", "metadata"]
    scoring: { thresholds: [3.0, 2.5, 2.0, 1.5, 1.0, 0.7], direction: "lower_is_better", weight: 0.15 }
    display: { format: "{:.2f}x", section: "valuation_analysis", peer_compare: true }

  trailing_peg:
    name: "Trailing PEG (P/E ÷ 3yr PAT CAGR)"
    module: "builtin.valuation"
    function: "compute_trailing_peg"
    inputs: ["financials", "metadata"]
    params: { cagr_years: 3 }
    scoring: { thresholds: [4.0, 3.0, 2.0, 1.5, 1.0, 0.5], direction: "lower_is_better", weight: 0.18 }
    display: { format: "{:.2f}x", section: "valuation_analysis", peer_compare: true }

  ev_ebitda:
    name: "EV/EBITDA"
    module: "builtin.valuation"
    function: "compute_ev_ebitda"
    inputs: ["financials", "balance_sheet", "metadata"]
    scoring: { mode: "sector_relative_percentile", direction: "lower_is_better", weight: 0.12 }
    display: { format: "{:.1f}x", section: "valuation_analysis", peer_compare: true }

  pe_vs_historical:
    name: "P/E Percentile (10yr traded range)"
    module: "builtin.valuation"
    function: "compute_pe_percentile"
    # Needs price: the band is each year-end close over that year's EPS.
    inputs: ["financials", "metadata", "price"]
    params: { years: 10 }
    scoring: { thresholds: [90, 75, 60, 50, 35, 20], direction: "lower_is_better", weight: 0.13 }
    display: { format: "{:.0f}th percentile", section: "valuation_analysis" }

  dcf_margin_of_safety:
    name: "DCF Margin of Safety"
    module: "builtin.valuation"
    function: "compute_dcf_margin"
    inputs: ["financials", "cashflow", "metadata"]
    # discount_rate and terminal_growth come from config.yaml's macro block
    params: { projection_years: 10 }
    scoring: { thresholds: [-30, -10, 0, 10, 20, 35], direction: "higher_is_better", weight: 0.15 }
    display: { format: "{:.0f}%", section: "valuation_analysis" }

  reverse_dcf_growth:
    name: "Reverse DCF Implied Growth"
    module: "builtin.valuation"
    function: "compute_reverse_dcf"
    inputs: ["financials", "cashflow", "metadata"]
    scoring: { mode: "comparison_to_actual", weight: 0.10 }
    display: { format: "{:.1f}% implied", section: "valuation_analysis" }

  earnings_yield_vs_gsec:
    name: "Earnings Yield Spread vs G-Sec"
    module: "builtin.valuation"
    function: "compute_earnings_yield_spread"
    inputs: ["financials", "metadata"]
    scoring: { thresholds: [-3, -1, 0, 1, 2, 4], direction: "higher_is_better", weight: 0.05 }
    display: { format: "{:+.1f}pp", section: "valuation_analysis" }

  # ── Phase 2 forward signal — registered at weight 0.0 (KTD1) ──
  # v05 §12 says headroom "lands in the price element"; §13 forbids changing
  # SQGLP scoring. Those reconcile only at zero weight: the scorer's
  # `weight == 0` branch continues before weighted accumulation, so this
  # reaches neither the element mean, the composite, nor the coverage
  # denominator — an errored one cannot even depress coverage.
  #
  # Inputs are all truncatable frames on purpose, with no `metadata`: the
  # backtest withholds Stock P/E and market cap as look-ahead leaks, and a
  # metric reading them excludes itself from the walk-forward check (A2).
  #
  # Every threshold below is a STARTING POINT awaiting Phase 5 simulator
  # evidence, like the lifecycle trigger thresholds. Tuning them moves
  # `forward_signal_hash` only, leaving score history's scoring regime — and
  # every ticker's momentum baseline — intact (KTD8).
  rerating_headroom:
    name: "Re-rating Headroom (own-fundamentals justified multiple)"
    module: "builtin.valuation"
    function: "compute_rerating_headroom"
    inputs: ["financials", "ratios", "price"]
    params:
      roce_years: 5
      growth_field: "pat"
      growth_years: 5
      longevity_years: 10
      longevity_threshold: 15
      # Band boundaries. N boundaries define N+1 bands, lowest first.
      roce_bands: [12, 18, 25]
      growth_bands: [8, 15, 25]
      # Rows are RoCE bands, columns growth bands — both low to high.
      justified_multiple:
        - [10, 13, 16, 19]
        - [13, 17, 22, 27]
        - [16, 22, 29, 36]
        - [19, 26, 35, 45]
      # Bands on the count of years RoCE cleared longevity_threshold.
      longevity_bands: [3, 6, 8]
      longevity_multipliers: [0.85, 1.0, 1.10, 1.20]
      # Interpretation bands for the report (R8) — a zero-weight metric never
      # receives a score, so without these the section ships numbers rather
      # than signal.
      favourable_pct: 25
      stretched_pct: -25
    scoring: { weight: 0.0 }
    display: { format: "{:+.0f}%", section: "forward_signals" }
