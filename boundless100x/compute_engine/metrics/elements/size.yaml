element: size

# ── On the `presentation:` blocks below (R11, R12, R3) ──
#
# Every metric in this registry carries one. It states the unit the value is
# in, the direction of goodness, one plain line on what the metric measures,
# and the bands that turn the number into a reading. The vocabulary for `unit`
# and `direction` is closed and enforced at startup — see
# `metrics/validator.py`, which also states the band-walk semantics once.
#
# Where a metric is scored on thresholds, its band boundaries are taken from
# those thresholds rather than invented: the boundaries at the 5/6 and 3/6
# score marks, so the reading a reader sees and the score the model gives can
# never point opposite ways. Nothing here can move a score — `presentation` is
# excluded from both regime hashes by name (`engine.HASH_EXEMPT_KEYS`).

metrics:
  market_cap:
    name: "Market Cap (₹ Cr)"
    module: "builtin.size"
    function: "compute_market_cap"
    inputs: ["price", "financials"]
    scoring:
      thresholds: [200000, 100000, 50000, 20000, 5000, 1000]
      direction: "lower_is_better"
      weight: 0.25
    display: { format: "₹{:,.0f} Cr", section: "size_analysis", peer_compare: true }
    presentation:
      unit: "inr_crore"
      direction: "lower_is_better"
      meaning: >-
        What the whole company costs today. Small is the point here — a
        hundred-bagger needs room to grow into, and a large cap has already
        used most of its room up.
      bands: [[50000, "limited headroom"], [5000, "moderate headroom"]]
      low_label: "wide headroom"

  institutional_holding:
    name: "FII + DII Holding (%)"
    module: "builtin.size"
    function: "compute_institutional_holding"
    inputs: ["shareholding"]
    scoring:
      mode: "range_optimal"
      optimal_range: [1, 10]
      weight: 0.25
    display: { format: "{:.1f}%", section: "size_analysis", peer_compare: true }
    presentation:
      unit: "percent"
      direction: "range_optimal"
      meaning: >-
        How much of the company professional funds already own. A little is
        validation that somebody serious has looked; a lot means the
        re-rating has happened without you.
      # The two ends of the scored optimal_range, so the reading and the
      # score agree about where the sweet spot is.
      bands: [[10, "crowded"], [1, "in the target range"]]
      low_label: "barely owned"

  # ── Phase 3 fast-lane input — registered at weight 0.0 ──
  # The lane gates in lifecycle/lane_gates.yaml read this; SQGLP scoring must
  # not. The scorer's `weight == 0` branch returns before weighted
  # accumulation, so it reaches neither the size element mean, the composite,
  # nor the coverage denominator — following the precedent Phase 2 set for
  # every zero-weight metric.
  institutional_accumulation_streak:
    name: "FII + DII Accumulation Streak"
    module: "builtin.size"
    function: "compute_institutional_accumulation_trend"
    inputs: ["shareholding"]
    params:
      # Rises needed before the flag is raised. A STARTING POINT awaiting
      # Phase 4/5 simulator evidence, and deliberately the same number as the
      # lane gate's threshold — §9.2's "2+ consecutive quarters".
      rising_min_rises: 2
    scoring: { weight: 0.0 }
    display: { format: "{:.0f} rises", section: "size_analysis" }
    presentation:
      unit: "count"
      direction: "higher_is_better"
      meaning: >-
        How many quarters in a row the funds have been adding. Two or more
        says somebody is buying before the accounts have explained why.
      # One band, because the system names exactly one boundary here: the
      # `rising_min_rises` param above, which is also §9.2's lane gate. A
      # second, higher band would be a number nothing else in the system
      # holds — invented precision on a signal that carries no score.
      bands: [[2, "accumulating"]]
      low_label: "no streak"

  analyst_coverage:
    name: "Analyst Coverage Count"
    module: "builtin.size"
    function: "compute_analyst_count"
    inputs: ["analyst_coverage"]
    scoring:
      thresholds: [20, 15, 10, 5, 3, 1]
      direction: "lower_is_better"
      weight: 0.25
    display: { format: "{:.0f} analysts", section: "size_analysis" }
    presentation:
      unit: "count"
      direction: "lower_is_better"
      meaning: >-
        How many analysts publish on the company. Fewer is better here — a
        stock that twenty desks already model is a stock already priced.
      bands: [[10, "crowded"], [3, "lightly covered"]]
      low_label: "undiscovered"

  daily_turnover_ratio:
    name: "Daily Turnover Ratio (%)"
    module: "builtin.size"
    function: "compute_turnover_ratio"
    inputs: ["price"]
    scoring:
      mode: "range_optimal"
      optimal_range: [0.02, 0.1]
      weight: 0.25
    display: { format: "{:.3f}%", section: "size_analysis" }
    presentation:
      unit: "percent"
      direction: "range_optimal"
      meaning: >-
        How much of the company changes hands on an average day. Too little
        and a position cannot be built or exited; too much and you are
        trading against a crowd.
      bands: [[0.1, "heavily traded"], [0.02, "in the target range"]]
      low_label: "illiquid"
