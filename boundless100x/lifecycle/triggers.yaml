# Declared lifecycle transitions.
#
# One YAML entry per transition, evaluated by lifecycle/evaluator.py the way
# the scorer reads the metric registry. Thresholds here are STARTING POINTS
# from the v05 roadmap, not calibrated values — evidence for tuning them comes
# from the Phase 4 strategy simulator (v05 §12 Phase 5).
#
# Condition kinds (exactly one key per condition):
#   metric:        a computed metric's value; add `persist_years: N` to require
#                  the comparator to hold across the last N entries of its
#                  raw_series instead
#   score:         `composite` or an element name
#   verdict:       the 100x eligibility verdict
#   flag_present / flag_absent:
#                  a MetricResult flag. `sources` names the metrics expected to
#                  emit it — absence proves nothing if they did not run
#   checkpoint:    a summary count over recorded checkpoint outcomes
#
# A condition whose inputs are missing is indeterminate, never a silent pass.

triggers:

  # ── Pre-position transitions: no capital moves, so these auto-apply ──

  qualification_passed:
    label: "Qualification passed"
    rationale: >
      Both readings agree the company is worth tracking: the conjunctive 100x
      gates are not disqualifying it, and the additive composite clears the
      lane floor.
    from: [screen]
    to: qualify
    mode: all
    conditions:
      - { verdict: eligible }
      - { score: composite, comparator: gte, threshold: 5.5 }

  qualification_failed:
    label: "Qualification failed"
    rationale: >
      A gate disqualified the company outright. Failing a 100x gate does not
      make it a bad business, only an unlikely hundred-bagger — it leaves this
      lane rather than being marked avoid.
    from: [screen, qualify]
    to: dropped
    mode: all
    conditions:
      - { verdict: not_eligible }

  awaiting_entry_price:
    label: "Qualified, awaiting entry price"
    rationale: >
      A qualified company whose price has run ahead of its history is worth
      watching, not buying. Great companies bought at the top of their own
      valuation band produce mediocre returns.
    from: [qualify]
    to: watch
    mode: all
    conditions:
      - { verdict: eligible }

  # ── Position-opening transition: proposed, never auto-applied ──

  valuation_buy_zone:
    label: "Valuation entered the buy zone"
    rationale: >
      Entry multiple is inside its own ten-year band and growth is not already
      fully paid for. This proposes a first tranche; the owner decides.
    from: [watch]
    to: probe
    mode: all
    conditions:
      - { metric: pe_vs_historical, comparator: lte, threshold: 60 }
      - { metric: trailing_peg, comparator: lte, threshold: 2.0 }
      - flag_absent: reverse_dcf_overpriced
        sources: [reverse_dcf_growth]

  # ── Core-lane kill-switches (v05 §6.1) ──
  #
  # Each moves a held position to `exit_review` — never an automatic sell. The
  # report states which switch fired and on what evidence; the owner decides.
  # Thresholds are starting points awaiting simulator evidence.

  capital_efficiency_break:
    label: "Capital efficiency break"
    rationale: >
      RoCE below 15% for two consecutive years. The compounding engine has
      stalled — one weak year is noise, two is a pattern. Read from the yearly
      series rather than the five-year mean, which a single strong early year
      can hold above the line for years after the business has turned.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - { metric: roce_5yr_avg, comparator: lt, threshold: 15, persist_years: 2 }

  growth_quality_degradation:
    label: "Growth quality degraded to debt-driven"
    rationale: >
      The four-lever decomposition now grades growth as financial-leverage
      dominant. Earnings are still rising, but on borrowing rather than on the
      business — amplified in good times and accelerating in bad.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - flag_present: growth_quality_risky
        sources: [growth_quality_grade]

  incremental_return_break:
    label: "Incremental returns below cost of capital"
    rationale: >
      ROIIC has fallen under the 12% discount rate: new capital is now
      destroying value even while reported profit grows. No persistence window
      is layered on because ROIIC is already an incremental measure across a
      multi-year window — its own construction, not a single year's reading.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - { metric: roiic, comparator: lt, threshold: 12.0 }

  valuation_saturation:
    label: "Valuation saturated"
    rationale: >
      Price is at the top of its own ten-year band AND the market is implying
      growth the company has never demonstrated. Either alone is tolerable in a
      compounder; together they mean the price has outrun any plausible
      fundamentals.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - { metric: pe_vs_historical, comparator: gt, threshold: 95 }
      - flag_present: reverse_dcf_overpriced
        sources: [reverse_dcf_growth]

  governance_event:
    label: "Governance event"
    rationale: >
      Promoter pledge crossed its red-flag threshold. Pledge is thesis-level
      invalidation rather than a metric that merely worsens — the alignment the
      whole case rests on has changed.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - flag_present: promoter_pledge_red_flag
        sources: [promoter_pledge]

  checkpoints_failed:
    label: "Thesis checkpoints missed"
    rationale: >
      Two or more recorded checkpoints came due and were not met. The thesis as
      written is not happening. Checkpoints that could not be evaluated are not
      counted — a stale fetch is not evidence against a company.
    from: [probe, scale]
    to: exit_review
    mode: all
    conditions:
      - { checkpoint: missed, comparator: gte, threshold: 2 }

  # ── Pre-position deterioration: no capital at risk, so this drops rather
  #    than exits, and may auto-apply ──

  fundamentals_deteriorated:
    label: "Fundamentals deteriorated before entry"
    rationale: >
      A watched company whose economics broke before it ever became buyable
      leaves the lane. Nothing is held, so there is no position to review — the
      candidate is simply no longer a candidate.
    from: [qualify, watch]
    to: dropped
    mode: any
    conditions:
      - { metric: roce_5yr_avg, comparator: lt, threshold: 15, persist_years: 2 }
      - { metric: roiic, comparator: lt, threshold: 12.0 }
      - flag_present: growth_quality_risky
        sources: [growth_quality_grade]
      - flag_present: promoter_pledge_red_flag
        sources: [promoter_pledge]
