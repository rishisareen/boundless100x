# Boundless100x — SQGLP Research Pipeline Configuration

# ── Target Company ──
target:
  ticker: "ASTRAL"
  bse_code: "532830"
  nse_symbol: "ASTRAL"

# ── Macro Assumptions ──
# Reach every metric as parameter defaults; a metric's own YAML params override.
# Values are slow-moving but not constant — revisit when the rate cycle turns.
macro:
  inflation_pct: 5.0          # Deflates revenue growth for the price lever
  strong_real_growth_pct: 10.0 # Real growth above this reads as strong pricing power
  gsec_yield_pct: 7.0         # India 10yr, for the earnings-yield spread
  discount_rate: 0.12         # WACC proxy for Indian mid-caps (DCF + reverse DCF)
  terminal_growth: 0.04       # Gordon terminal rate

# ── Analysis Period ──
analysis_period:
  financials_years: 10
  price_history_years: 10
  shareholding_quarters: 20

# ── Data Fetching ──
fetching:
  rate_limit_seconds: 2
  cache_ttl_hours: 24
  screener_base_url: "https://www.screener.in"
  retry_count: 3
  retry_delay_seconds: 5

# ── LLM Configuration ──
llm:
  provider: "anthropic"
  pass1_model: "claude-sonnet-4-6"
  pass2_model: "claude-sonnet-4-6"
  max_tokens: 4096
  enabled: true
  skip_pass1_if_no_ar: true
  pass1_ar_char_budget: 3000  # Annual-report chars Pass 1 may read. This is
                              # the binding cap downstream of the per-section
                              # caps in annual_reports.sections — raise it to
                              # let more MD&A reach the prompt.

# ── Annual Reports ──
annual_reports:
  enabled: true
  max_reports: 3          # Retain several years — promises-kept compares a
                          # report's guidance against the next year's delivery
  max_pages: 30           # Fallback window: first N pages, used when a
                          # section cannot be located
  max_text_chars: 5000    # Cap on the combined single-string AR text
  scan_pages: 150         # How deep to search for section headings. MD&A
                          # commonly starts past page 100; a 30-page search
                          # finds the chairman's letter and little else.
  sections:               # Per-section character caps. Keep every cap >=
                          # max_text_chars, or the all-fallback combined
                          # string stops matching pre-section behaviour.
    mdna: 12000
    chairman: 6000
    governance: 8000

# ── Output ──
output:
  formats: ["html", "md", "json"]
  report_dir: "output/reports"
  include_raw_data: true
