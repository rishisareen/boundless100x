# Boundless100x — SQGLP Research Pipeline Configuration

# ── Target Company ──
target:
  ticker: "ASTRAL"
  bse_code: "532830"
  nse_symbol: "ASTRAL"

# ── Macro Assumptions ──
# Reach every metric as parameter defaults; a metric's own YAML params override.
# Values are slow-moving but not constant — revisit when the rate cycle turns.
macro:
  inflation_pct: 5.0          # Deflates revenue growth for the price lever
  strong_real_growth_pct: 10.0 # Real growth above this reads as strong pricing power
  gsec_yield_pct: 7.0         # India 10yr, for the earnings-yield spread
  discount_rate: 0.12         # WACC proxy for Indian mid-caps (DCF + reverse DCF)
  terminal_growth: 0.04       # Gordon terminal rate

# ── Analysis Period ──
analysis_period:
  financials_years: 10
  price_history_years: 10
  shareholding_quarters: 20

# ── Data Fetching ──
fetching:
  rate_limit_seconds: 2
  cache_ttl_hours: 24
  screener_base_url: "https://www.screener.in"
  retry_count: 3
  retry_delay_seconds: 5

# ── Corpus Snapshots ──
# `raw_data/` is gitignored and is the only copy of everything ever fetched, so
# a refetch has no revert. Snapshot first. The default is OUTSIDE the
# repository on purpose: the repo sits in an iCloud-synced directory and the
# corpus is ~370MB, so an in-tree copy would churn the full amount through sync
# and may not settle into a stable copy. A destination inside the repo is
# refused.
corpus_snapshot:
  dir: "~/.boundless100x/corpus_snapshots"

# ── LLM Configuration ──
llm:
  # Which transport carries every call — Pass 1, Pass 2 and the Stage 1.5
  # extraction alike. Two legal values, and the choice is a billing route
  # rather than a behaviour: both submit the identical prompt and both parse
  # the same way, so nothing downstream can tell which one ran.
  #
  #   anthropic   The Anthropic API, paid from API credits (the default).
  #   claude_cli  Headless Claude Code (`claude -p`), billed against the Max
  #               subscription's monthly headless-credit pool. Needs Claude
  #               Code installed and logged in on this machine.
  #
  # Overridable per run: `--llm-provider` on `analyze` and `sweep`.
  provider: "anthropic"
  # claude_cli only. Must be on PATH; a missing binary degrades to
  # compute-only exactly the way a missing API key does.
  #
  # PINNED MINIMUM: Claude Code 2.1.225. The flag set the transport uses is
  # version-specific in BOTH directions — `--bare` must stay absent (it breaks
  # subscription auth on this version) and `--mcp-config` needs the
  # `{"mcpServers":{}}` shape rather than `{}`. Re-verify the invocation in
  # `llm_layer/transport.py` before assuming a newer CLI behaves the same.
  claude_binary: "claude"
  # claude_cli only — per-call subprocess timeout. A ceiling for a slow Opus
  # completion against a 16000-token budget with thinking on, not a
  # description of the typical call. Every call also pays a process spawn and
  # CLI startup before the model speaks, so a full extraction sweep's wall
  # clock grows by minutes on this path.
  cli_timeout_seconds: 600
  pass1_model: "claude-sonnet-5"
  pass2_model: "claude-sonnet-5"
  deep_model: "claude-opus-5"   # What `--deep` swaps every call to
  max_tokens: 16000             # Thinking is on by default on the Claude 5
                                # family and bills against this same ceiling,
                                # so a budget sized for the JSON alone
                                # truncates the object mid-write. A high cap
                                # costs nothing unless it is reached — but it
                                # IS the worst case `sweep --dry-run` prices,
                                # so `estimated_cost_usd_max` rises with it.
  enabled: true
  skip_pass1_if_no_ar: true
  pass1_ar_char_budget: 3000  # Annual-report chars Pass 1 may read. This is
                              # the binding cap downstream of the per-section
                              # caps in annual_reports.sections — raise it to
                              # let more MD&A reach the prompt.
  # ── Forward-growth extraction (Stage 1.5) ──
  # A structured-extraction task, not a judgement one, so it carries its own
  # model rather than tracking Pass 1 and 2. `--deep` still moves it to Opus.
  #
  # CHANGING THIS ID SPENDS MONEY. It is part of the sidecar's version block,
  # so a new value invalidates every cached extraction under raw_data/ and the
  # corpus is re-extracted — by the next `sweep`, or one ticker at a time and
  # silently by the next `analyze` with the LLM enabled. That is the
  # versioning working, not a bug: a reading is only as good as the model that
  # produced it. Price it with `sweep --all --dry-run` first.
  forward_growth_model: "claude-sonnet-5"
  forward_growth_char_budget: 12000 # Per gated section, per report year — the
                                    # extractor reads each section separately,
                                    # unlike Pass 1's combined single string.
                                    # KEEP THIS >= the largest cap in
                                    # annual_reports.sections. The budget
                                    # truncates from the FRONT, and MD&A opens
                                    # with the economic review while guidance
                                    # lives in the outlook near its end — a
                                    # budget below the section cap shows the
                                    # extractor precisely the half that cannot
                                    # contain a target. Measured on ZYDUSLIFE
                                    # FY2024: 4 of the 5 `outlook` mentions in
                                    # a 12,000-char MD&A slice sat past 6,000.

# ── Annual Reports ──
annual_reports:
  enabled: true
  max_reports: 3          # Retain several years — promises-kept compares a
                          # report's guidance against the next year's delivery
  max_pages: 30           # Fallback window: first N pages, used when a
                          # section cannot be located
  max_text_chars: 5000    # Cap on the combined single-string AR text
  scan_pages: 150         # How deep to search for section headings. MD&A
                          # commonly starts past page 100; a 30-page search
                          # finds the chairman's letter and little else.
  sections:               # Per-section character caps. Keep every cap >=
                          # max_text_chars, or the all-fallback combined
                          # string stops matching pre-section behaviour.
    mdna: 12000
    chairman: 6000
    governance: 8000
  content_gate:           # KTD9 — `found` is a claim, not a guarantee. A
                          # located section must also look like the section it
                          # claims to be, or it is downgraded to `suspect` and
                          # excluded from extraction exactly as `fallback` is.
                          # Runs on the extraction path, so tuning this needs
                          # no refetch. Watch the suspect count: near zero
                          # means the gate is not actually gating.
    enabled: true
    scan_chars: 3000      # How much of a slice's opening the gate reads. A
                          # wrong-section slice is wrong from its first line.
    min_markers:          # Subject markers needed when the section's own
      mdna: 1             # heading does not open the slice. One, deliberately:
      chairman: 1         # a two-marker rule modelled on SEBI LODR Sch V(B)
      governance: 1       # rejected 11 of 13 real MD&A slices, 11 of which
                          # were genuine — real MD&A opens with narrative
                          # economy prose and reaches the mandated
                          # sub-headings pages later.

# ── Deployment Pace (v05 §11) ──
# Deploy more cautiously when the whole corpus is expensive. Only the floor,
# the tightening factor and the contributor minimum are settings: the spread
# itself is COMPUTED as the median earnings-yield-over-G-Sec across the cached
# corpus, so there is no number to keep current and no staleness to handle.
#
# This modulates ENTRY thresholds only. It never fires, suppresses, or
# overrides a kill-switch or an eligibility gate — macro slows buying, company
# evidence decides everything else. Starting points awaiting Phase 4 simulator
# evidence. Deliberately outside the hashed `macro:` block: policy, not an
# assumption a metric computes with.
deployment_pace:
  floor_pp: -1.0          # Median spread below this reads as a compressed regime
  tighten_factor: 0.85    # Entry thresholds become this much harder to satisfy
  min_contributors: 8     # A median over fewer names is not a regime signal, and
                          # an unknown reading must not tighten entry at all

# ── Friction (v05 §8.2) ──
# What a modeled position keeps after tax and slippage. Every figure derived
# from these is an ESTIMATE: the holding period runs from a `probe`
# confirmation date rather than a fill, market bars stand in for trade prices,
# and no cost basis is recorded anywhere in this system.
#
# India's equity regime as of 2026, held here as settings rather than literals
# per §8.2's own instruction — a statute change is a config edit, never a code
# change. Starting points. Deliberately outside the hashed `macro:` block, for
# the same reason `deployment_pace:` is: policy, not an assumption a metric
# computes with.
friction:
  stcg_pct: 20.0          # Short-term capital gains on equity
  ltcg_pct: 12.5          # Long-term capital gains on equity
  ltcg_holding_days: 365  # At or beyond this many days, the long-term rate applies
  slippage_bps: 100       # ROUND TRIP — entry and exit together, deducted from
                          # the gross return before tax, which is the order the
                          # costs are actually borne in

# ── Portfolio (v05 §8.1, §14.1) ──
# Sleeve split, tranche sizing, and concentration guardrails.
#
# THE CAPS BELOW ARE COUNTS OF POSITIONS, NOT PERCENTAGES OF CAPITAL. The
# roadmap states them as percentages — 10–15% per core name, 5% per re-rating
# name, 25–30% per sector — but this system records no invested amount, no
# tranche and no cost basis anywhere, so a percentage would have no denominator
# to check against. A count is a proxy for those percentages, honest only
# because the sizing rules are near equal-weight; a computed-from-nothing
# percentage would read as a measurement, which is worse than a coarse rule.
#
# `sleeve_split` and `tranche_size_pct` ARE percentages, and are placeholders:
# nothing reads them yet, for the same reason — allocating between sleeves
# needs rupee amounts this system does not hold. Starting points awaiting Phase
# 5 simulator evidence. Deliberately outside the hashed `macro:` block, for the
# same reason `deployment_pace:` and `friction:` are: policy, not an assumption
# a metric computes with.
portfolio:
  sleeve_split:              # §14.1 — compounder sleeve vs. re-rating sleeve
    core: 0.7
    rerating: 0.3
  tranche_size_pct:          # §4.4 — a core position built in thirds, a
    core: 0.33               # re-rating position in halves
    rerating: 0.5
  max_positioned_per_lane:   # COUNT of positioned names, per lane
    core: 8
    rerating: 5
  max_positioned_per_sector: 3   # COUNT of positioned names sharing a sector

# ── Simulator (Phase 4 strategy simulator, KTD3) ──
# The simulated owner's policy block. §14.4 gives every money-moving
# transition a human confirmer; the replay has no human, so it substitutes
# this config, stating per decision kind what production leaves to the
# owner's judgement: how long a proposal sits before it is confirmed, how
# wide a fabricated fast-lane catalyst's window is, and what happens when a
# transition would breach a concentration cap. Every value below is recorded
# into the run's own output artifact verbatim, so a result can be
# re-derived from its own record.
#
# Deliberately outside the hashed `macro:` block, for the same reason
# `deployment_pace:`, `friction:` and `portfolio:` are: owner policy, not an
# assumption a metric computes with.
simulator:
  starting_pool: 100        # SETTLED (decision 1): unitless "capital units".
                             # Every simulator output is a ratio, so the unit
                             # cancels and no simulated figure can be mistaken
                             # for a real rupee amount.
  confirmation_lag_days:    # SETTLED (decision 2): trading days between a
                             # proposal and its confirmation. DELIBERATELY
                             # NON-ZERO — an instantaneous simulated owner
                             # would flatter cash drag and deployment pace to
                             # exactly zero, the two readings this phase
                             # exists to produce honestly rather than assume.
    entry: 5                 # probe / scale
    exit: 2                  # exit_review -> exited
    route: 5                 # routing an exit's proceeds into the next candidate
  catalyst_window_months: 6 # SETTLED (decision 3): the aggressive end of
                             # §9.1's 6-18 month horizon, not the midpoint —
                             # the fabricated fast-lane catalyst (KTD6) is
                             # what drives catalyst-spent exits, and the owner
                             # prefers the lane's discipline tested at its
                             # tightest stated bound.
  cap_posture: enforced     # SETTLED (decision 5, REOPENED then RESETTLED
                             # 2026-08-07): one of enforced / advisory /
                             # override, mapped onto `advance.decide()`'s own
                             # `override_caps: bool` (enforced -> False,
                             # withheld; advisory/override -> True, proceeds
                             # with the breach recorded). `enforced` is what
                             # `advance --apply` actually runs under today —
                             # see CLAUDE.md, "Two lanes" — so it is the
                             # baseline; the other two postures ship as
                             # reachable config values for a Phase 5 sweep of
                             # what the guardrail cost or saved.
  # reduce_fraction is DELIBERATELY ABSENT — no key, no default.
  # DEFERRED (decision 4): the §14.3 "reduce" severity's partial-sale
  # fraction is unsettled by the owner. Inventing a number here would read
  # as settled when it is not. In the baseline every valuation_saturation
  # exit resolves through the same review-then-confirm path as any other
  # kill-switch (a full exit after the exit lag) and is tagged `reduce` only
  # so the affected sample is counted separately — the partial-sale
  # mechanics ship built but inactive until the owner settles a fraction.

# ── Output ──
output:
  formats: ["html", "md", "json"]
  report_dir: "output/reports"
  include_raw_data: true
